<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Login | OAV Mantra Classes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="OAV3.CSS">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #091a38 0%, #1e3a8a 100%);
            padding: 24px 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .login-wrapper {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 36px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.35s ease-out;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-header img {
            height: 54px;
            margin-bottom: 12px;
        }

        .brand-header h1 {
            color: #0f172a;
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .brand-header p {
            color: #64748b;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #2563eb;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 20px;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .back-link:hover {
            transform: translateX(-4px);
        }

        .notice-box {
            background: #fffbeb;
            border-left: 4px solid #f59e0b;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #92400e;
            margin-bottom: 22px;
            display: none;
        }

        .notice-box.show {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.9rem;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .input-with-icon input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            color: #0f172a;
            transition: all 0.2s ease;
        }

        .input-with-icon input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .login-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #1d4ed8, #1e3a8a);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-banner {
            color: #dc2626;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 18px;
            display: none;
        }

        .help-footer {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #f1f5f9;
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
        }

        .help-footer a {
            color: #2563eb;
            font-weight: 700;
            text-decoration: none;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            body { padding: 16px 12px; }
            .login-wrapper { padding: 28px 20px; border-radius: 16px; }
            .brand-header h1 { font-size: 1.45rem; }
            .brand-header p { font-size: 0.88rem; }
            .login-btn { padding: 13px; font-size: 0.98rem; }
        }
    </style>
</head>
<body>
    <main class="login-wrapper">
        <a href="Index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Homepage</a>
        
        <div class="brand-header">
            <img src="OAV LOGO.png" alt="OAV Mantra Logo">
            <h1>Student Portal Login</h1>
            <p>Enter your Enrollment ID and registered Mobile Number to access your classes & notes.</p>
        </div>

        <div id="noticeBox" class="notice-box">
            <i class="fas fa-exclamation-triangle"></i>
            <span id="noticeText">Payment approval is required before class room content unlocks.</span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="enrollmentId">Enrollment ID *</label>
                <div class="input-with-icon">
                    <i class="fas fa-id-badge"></i>
                    <input type="text" id="enrollmentId" placeholder="e.g. OAV-123456-ABCD" required autocomplete="username" autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="mobile">Registered Mobile Number *</label>
                <div class="input-with-icon">
                    <i class="fas fa-phone"></i>
                    <input type="tel" id="mobile" placeholder="10-digit mobile number (e.g. 8926109490)" maxlength="15" required autocomplete="tel">
                </div>
            </div>

            <div id="errorBanner" class="error-banner"></div>

            <button type="submit" class="login-btn" id="loginSubmitBtn">
                <i class="fas fa-sign-in-alt"></i> Access Study Room
            </button>
        </form>

        <div class="help-footer">
            <p>New to OAV Mantra? <a href="Index.html#home">Enroll Now (₹500)</a></p>
            <p style="margin-top: 6px; font-size: 0.85rem;">Need assistance? Call Helpline: <strong>+91 89175 31123</strong></p>
        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
